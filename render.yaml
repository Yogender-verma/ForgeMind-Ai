services:
  # ForgeMind AI — FastAPI Backend Web Service
  - type: web
    name: forgemind-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: forgemind-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*"

databases:
  # ForgeMind AI — Managed PostgreSQL Database on Render
  - name: forgemind-db
    databaseName: forgemind
    user: forgemind_user
    plan: free
